apiVersion: fission.io/v1
kind: Function
metadata:
  creationTimestamp: null
  name: youtubeharv
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
    secrets:
    - youtube-api-key
  concurrency: 500
  environment:
    name: python39
    namespace: ""
  functionTimeout: 60
  idletimeout: 120
  package:
    functionName: youtubeharv.main
    packageref:
      name: youtubeharv-pkg
      namespace: ""
  requestsPerPod: 1
  resources: {}
